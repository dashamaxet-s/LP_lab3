[project]
name = "plugin-system"
version = "0.1.0"
description = "Plugin system with Protocol, Generic and dataclass"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
plugin-system = "plugin_system.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]